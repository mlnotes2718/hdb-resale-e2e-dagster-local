default_environment: dev
project_id: 019e80d9-1f72-752b-97f4-9673bad6941d
# environments:
# - name: dev
# - name: staging
# - name: prod

# Environment-specific overrides
environments:
  - name: dev
    config:
      plugins:
        loaders:
          - name: target-bigquery
            config:
              dataset: dev_postgres_hdb_resale_raw
              # Path to your dev/shared service account key
              # credentials_path: /path/to/your/dev-service-account.json -- keep for future

  - name: prod
    config:
      plugins:
        loaders:
          - name: target-bigquery
            config:
              dataset: prod_postgres_hdb_resale_raw
              # Path to your prod service account key
              # credentials_path: /path/to/your/dev-service-account.json -- keep for future
              
python: python3.11
plugins:
  extractors:
  - name: tap-postgres
    variant: meltanolabs
    pip_url: meltanolabs-tap-postgres
    config:
      database: postgres
      filter_schemas:
      - public
      host: aws-1-ap-northeast-2.pooler.supabase.com
      port: 5432
      user: postgres.hdsstnshkjzcccdaxlsb
    select:
    - public-hdb_resale_flat_prices_e2e.*
    metadata:
      public-hdb_resale_flat_prices_e2e:
        replication-method: INCREMENTAL
        replication-key: updated_at
  loaders:
  - name: target-bigquery
    variant: z3z1ma
    pip_url: git+https://github.com/z3z1ma/target-bigquery.git setuptools<80
    config:
      batch_size: 104857600
      credentials_path: /home/sctp/sctp-dsai-ds3f-ds5-d1606b4d308b.json
      dataset: postgres_hdb_resale_raw
      denormalized: true
      flattening_enabled: true
      flattening_max_depth: 1
      location: US
      method: batch_job
      project: sctp-dsai-ds3f-ds5
